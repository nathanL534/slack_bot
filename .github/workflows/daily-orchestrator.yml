name: Daily Watchlist Orchestrator

on:
  schedule:
    - cron: '30 2 * * *'  # 9:30 PM CDT (2:30 AM UTC)
  workflow_dispatch:  # Allow manual triggering

jobs:
  run_daily_orchestrator:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Orchestrator
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: ${{ secrets.APCA_API_BASE_URL }}
          APCA_API_DATA_URL: ${{ secrets.APCA_API_DATA_URL }}
        run: |
          echo "🚀 Starting daily watchlist orchestrator at $(date -u)"
          python run_tasks.py daily_orchestrator

      - name: Send workflow status
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="completed successfully"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="failed"
          fi
          
          MESSAGE="$STATUS_EMOJI GitHub Actions: Daily orchestrator $STATUS_TEXT at $(date -u '+%Y-%m-%d %H:%M UTC')"
          
          if [ ! -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Sending status to Slack..."
            curl -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"$MESSAGE\"}" || echo "Failed to send Slack notification"
          else
            echo "SLACK_WEBHOOK_URL not configured, skipping notification"
          fi
          
          echo "Workflow status: $MESSAGE"
