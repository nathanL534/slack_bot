name: Daily Watchlist Orchestrator

on:
  schedule:
    - cron: '30 2 * * *'  # 9:30 PM CDT (2:30 AM UTC)
  workflow_dispatch:  # Allow manual triggering

jobs:
  trigger_daily_orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Orchestrator
        run: |
          curl -X GET https://slack-bot-xg1w.onrender.com/daily-orchestrator
