name: Daily Portfolio Check

on:
  schedule:
    - cron: '0 14 * * 1-5'  # 9AM CDT, Monday-Friday
    - cron: '0 22 * * 1-5'  # 5PM CDT, Monday-Friday
  workflow_dispatch:

jobs:
  trigger_daily_check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /daily-check
        run: |
          curl -X GET https://slack-bot-xg1w.onrender.com/daily-check
